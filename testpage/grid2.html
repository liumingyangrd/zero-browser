<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Minimal Grid repro</title><style>
.g { display:grid; grid-template-columns: 120px 1fr; gap:8px; }
.a { border:1px solid #999; padding:6px; }
</style></head><body>
<h1>minimal grid</h1>
<div class="g">
  <div class="a">One</div>
  <div class="a">Two</div>
  <div class="a">Three</div>
  <div class="a">Four</div>
</div>
</body></html>
