<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>本地测试页</title><style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-size:16px; line-height:1.6; }
  .wrap { max-width:760px; margin:24px auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:24px; }
  h1 { font-size:26px; color:#0f766e; margin-top:0; }
  .row { display:flex; gap:12px; margin-top:16px; }
  .card { flex:1; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; padding:14px; }
  .card h3 { margin:0 0 6px 0; color:#047857; }
  ul { padding-left:24px; }
  pre { display:block; white-space:pre; background:#0f172a; color:#7dd3fc; padding:12px; border-radius:8px; }
  a { color:#2563eb; }
</style></head>
<body>
  <div class="wrap">
    <h1>本地 HTTP 测试页</h1>
    <p>这个页面通过 <code>http://127.0.0.1</code> 加载，用来验证渲染内核。</p>
    <div class="row">
      <div class="card"><h3>HTML</h3><p>标签、属性、实体。</p></div>
      <div class="card"><h3>CSS</h3><p>盒模型、flex、颜色。</p></div>
      <div class="card"><h3>列表</h3><p>项目符号与缩进。</p></div>
    </div>
    <ul>
      <li>无序列表第一项</li>
      <li>无序列表第二项</li>
    </ul>
    <pre>source --[ engine ]--&gt; box --[ paint ]--&gt; pixels</pre>
    <p><a href="browser://about">打开内置 about 页面</a></p>
  </div>
</body></html>
