<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>表单控件测试</title><style>
body { margin:0; background:#f8fafc; color:#0f172a; font-family:Segoe UI; font-size:14px; }
.form { max-width:640px; margin:20px auto; padding:20px; background:#fff; border:1px solid #e2e8f0; }
label { display:block; margin:12px 0 4px 0; font-weight:bold; }
input[type="text"] { width:320px; height:32px; }
input[type="password"] { width:320px; height:32px; }
textarea { width:420px; height:80px; }
select { width:200px; height:32px; }
button { height:34px; padding:0 18px; }
.row { display:flex; gap:10px; align-items:center; margin-top:14px; }
</style></head><body>
<div class="form">
  <h1>登录</h1>
  <label>用户名</label>
  <input type="text" value="zero-user">
  <label>密码</label>
  <input type="password" value="secret123">
  <label>个性签名</label>
  <textarea>从零自研渲染内核</textarea>
  <label>地区</label>
  <select><option>中国</option></select>
  <div class="row">
    <button>登录</button>
    <input type="submit" value="提交">
    <input type="button" value="取消">
  </div>
</div>
</body></html>
