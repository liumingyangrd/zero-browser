<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>表单提交测试</title><style>
body { margin:0; background:#f8fafc; color:#0f172a; font-family:Segoe UI; font-size:14px; }
.form { max-width:640px; margin:20px auto; padding:20px; background:#fff; border:1px solid #e2e8f0; }
h1 { font-size:20px; margin:0 0 12px 0; }
label { display:block; margin:12px 0 4px 0; font-weight:bold; }
input[type="text"] { width:320px; height:32px; }
input[type="password"] { width:320px; height:32px; }
input[type="checkbox"] { width:16px; height:16px; }
button { height:34px; padding:0 18px; }
</style></head><body>

<div class="form">
  <h1>登录（POST）</h1>
  <form id="login" method="post" action="/echo">
    <input type="hidden" name="csrf" value="tok-42">
    <label>用户名</label>
    <input type="text" name="user" value="zero-user">
    <label>密码</label>
    <input type="password" name="pass" value="secret123">
    <label>记住我</label>
    <input type="checkbox" name="remember" value="1" checked>
    <button type="submit" name="do" value="login">登录</button>
    <button type="button">取消</button>
  </form>
</div>

<div class="form">
  <h1>搜索（GET）</h1>
  <form id="search" method="get" action="/echo">
    <label>关键字</label>
    <input type="text" name="q" value="自研内核">
    <input type="submit" name="go" value="搜索">
  </form>
</div>

</body></html>
