<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Grid 布局测试</title><style>
body { margin:0; background:#f8fafc; color:#0f172a; font-family:Segoe UI; font-size:14px; }
h1 { font-size:20px; margin:16px 8px 8px 8px; }
.grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; padding:8px; }
.card { border:1px solid #cbd5e1; border-radius:6px; padding:14px; background:#ffffff; }
.card h3 { margin:0 0 6px 0; font-size:16px; }
.grid-mixed { display:grid; grid-template-columns: 180px 1fr 1fr; gap:10px; padding:8px; }
.wide { grid-column: span 2; background:#eef2ff; }
.grid-auto { display:grid; grid-template-columns: auto auto; gap:8px; padding:8px; }
.chip { border:1px solid #94a3b8; padding:6px 10px; background:#f1f5f9; }
</style></head><body>
<h1>CSS Grid 常用子集</h1>
<div class="grid3">
  <div class="card"><h3>卡 1</h3><p>repeat(3, 1fr) 三列等宽</p></div>
  <div class="card"><h3>卡 2</h3><p>第二列</p></div>
  <div class="card"><h3>卡 3</h3><p>第三列</p></div>
</div>
<div class="grid-mixed">
  <div class="card"><h3>侧栏</h3><p>180px 固定列</p></div>
  <div class="card wide"><h3>跨两列</h3><p>grid-column: span 2</p></div>
  <div class="card"><h3>回行</h3><p>第二行第一列</p></div>
  <div class="card"><h3>第二行第二列</h3><p>1fr</p></div>
  <div class="card"><h3>第二行第三列</h3><p>1fr</p></div>
</div>
<div class="grid-auto">
  <div class="chip">自动列</div>
  <div class="chip">auto 列</div>
</div>
</body></html>
