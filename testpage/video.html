<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>视频播放测试</title><style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-size:16px; }
  .wrap { max-width:760px; margin:24px auto; padding:20px; }
  h1 { font-size:26px; color:#38bdf8; margin-top:0; }
  video { display:block; width:640px; height:360px; background:#000000; border:1px solid #334155; }
  p { color:#94a3b8; font-size:14px; line-height:1.7; }
</style></head>
<body>
  <div class="wrap">
    <h1>自建浏览器视频播放</h1>
    <p>解码由 Windows Media Foundation 完成，画面绘制、播放/暂停、进度条、静音由自研引擎实现。</p>
    <video src="anim.wmv" controls autoplay loop muted width="640" height="360"></video>
    <p>点击画面切换播放/暂停；点底部进度条跳转；点右下角图标静音。</p>
  </div>
</body></html>
