<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flex block-child test</title><style>
.row { display:flex; gap:16px; padding: 0 32px 40px 32px; }
.cell { background:#eef2ff; border:1px solid #93c5fd; border-radius:10px; padding:18px; flex:1; }
.cell p { margin:0 0 8px 0; }
</style></head><body>
<h1>flex + block-level children</h1>
<div class="row">
  <div class="cell"><h3>A</h3><p>Block-level child one</p></div>
  <div class="cell"><h3>B</h3><p>Block-level child two</p></div>
  <div class="cell"><h3>C</h3><p>Block-level child three</p></div>
</div>
</body></html>
