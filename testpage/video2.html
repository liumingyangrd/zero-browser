<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Video playback test 2</title><style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-size:16px; }
  .wrap { max-width:820px; margin:16px auto; padding:12px; }
  h1 { font-size:20px; color:#38bdf8; margin:10px 0 6px 0; }
  p { color:#94a3b8; font-size:13px; margin:4px 0 10px 0; }
  video { display:block; width:640px; height:360px; background:#000000; border:1px solid #334155; }
</style></head>
<body>
  <div class="wrap">
    <h1>A: with autoplay -- should start playing automatically, with the two pause bars shown on the left of the control bar</h1>
    <video src="anim.wmv" controls autoplay muted width="640" height="360"></video>

    <h1>B: without autoplay -- should stay on the first frame and show the central play marker</h1>
    <video src="anim.wmv" controls muted width="640" height="360"></video>
  </div>
</body></html>
